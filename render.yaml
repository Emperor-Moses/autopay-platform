services:
  - type: web
    name: autopay-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: DIRECT_DEBIT_CALLBACK_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: NODE_ENV
        value: production
